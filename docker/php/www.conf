[www]
user  = www-data
group = www-data

listen = 9000

; Dynamic process manager — scales between min and max based on load.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Log requests that take longer than 5 s so slow queries are visible
; in `docker compose logs app`.
request_slowlog_timeout = 5s
slowlog                 = /proc/self/fd/2

; Surface PHP errors to stderr (visible via `docker compose logs app`)
php_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
