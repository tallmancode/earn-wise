server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;
    charset utf-8;

    # Suppress Chrome DevTools auto-discovery requests
    location = /.well-known/appspecific/com.chrome.devtools.json {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Allow PHP up to 120 s before nginx gives up (default is 60 s,
        # which causes 504s on slow first loads or heavy dashboard queries).
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout    120s;
        fastcgi_send_timeout    120s;
    }

    # Static assets — serve directly, do not forward to PHP
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
